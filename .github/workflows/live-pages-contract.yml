name: BookBridge live GitHub Pages catalog contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/test_live_pages_contract.py"
      - ".github/workflows/live-pages-contract.yml"
  schedule:
    - cron: "15 10 * * 2"

permissions:
  contents: read

jobs:
  hosted-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify live synthetic GitHub Pages pointer and search shards
        run: python3 -B tests/test_live_pages_contract.py
